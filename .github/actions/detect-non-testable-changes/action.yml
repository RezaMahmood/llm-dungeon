name: "Detect non-testable changes"
description: >-
  Outputs whether every file changed in the triggering push/PR is a
  non-testable artifact (documentation, specs, markdown, comments-only
  content) — content-type based, regardless of which directory those files
  live in. Implements the "Non-testable-artifact skip contract" in
  specs/023-cicd-pipeline-optimization/contracts/workflow-interfaces.md
  (FR-019/FR-020). A single testable file anywhere in the change set makes
  this false, even if every other file in the same change is non-testable.
  dorny/paths-filter only lists the changed files here — the "every file is
  non-testable" predicate itself is evaluated by
  scripts/workflow-checks/check-non-testable.mjs (the same module
  test-non-testable-detection.js unit-tests), not by dorny/paths-filter's
  own predicate-quantifier. Its "every" mode means "any changed file
  matches all patterns", not "every changed file matches some pattern" —
  the two aren't equivalent, and against a multi-pattern OR-style list like
  ours, that mismatch made this action always report false in practice
  (see #165 Scenario 6 live validation).

outputs:
  all-non-testable:
    description: >-
      "true" iff every changed file matches the non-testable glob set;
      "false" if at least one changed file is testable/buildable.
    value: ${{ steps.evaluate.outputs.all-non-testable }}

runs:
  using: "composite"
  steps:
    - name: List every changed file
      id: files
      uses: dorny/paths-filter@v3
      with:
        list-files: json
        filters: |
          all:
            - '**'

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: scripts/workflow-checks/package-lock.json

    - name: Install matcher dependencies
      shell: bash
      working-directory: scripts/workflow-checks
      run: npm ci --no-audit --no-fund

    - name: Evaluate whether every changed file is non-testable content
      id: evaluate
      shell: bash
      env:
        CHANGED_FILES_JSON: ${{ steps.files.outputs.all_files }}
      run: |
        RESULT=$(node scripts/workflow-checks/check-non-testable.mjs)
        echo "all-non-testable=$RESULT" >> "$GITHUB_OUTPUT"
