name: Backend Deploy

# CD: workflow_dispatch (and workflow_call), version input, no approval gate
# (specs/023-cicd-pipeline-optimization, FR-010/FR-011/FR-011b). Deploy is
# always a distinct, explicitly-triggered action — never a side effect of
# a push or merge to `main`. Backend deploys execute directly once
# triggered, unlike infrastructure-deploy.yml's approval-gated apply.
#
# Job graph: resolve-version -> build-on-demand (conditional) ->
# ensure-artifact -> deploy. build-on-demand is its own job (not a step of
# ensure-artifact) because GitHub Actions requires a reusable-workflow
# call (`uses: ./.github/workflows/_build-backend.yml`) to be the entire
# content of its job — see contracts/workflow-interfaces.md for the
# conceptual 3-stage contract this graph implements.
#
# Also callable via workflow_call (full-build-deploy.yml), with the same
# `version` semantics, so the combined workflow reuses this exact job graph
# instead of duplicating it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bare version number to deploy, e.g. 1.2.3 (not the backend-v<version> tag). Leave blank to deploy the latest available version at execution time."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Bare version number to deploy, e.g. 1.2.3 (not the backend-v<version> tag). Leave blank to deploy the latest available version at execution time."
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "The backend version that was deployed."
        value: ${{ jobs.ensure-artifact.outputs.version }}

permissions:
  # contents: write (not read) — the build-on-demand job below calls
  # _build-backend.yml, which needs contents: write to create a git
  # tag/GitHub Release via semantic-release. A called reusable workflow
  # cannot request more than its caller grants (GitHub Actions fails
  # the whole run at startup, zero jobs created, if it does) — this
  # bit only surfaces the first time an actual cache-miss deploy runs,
  # so it went undetected until then.
  contents: write
  id-token: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      must_build: ${{ steps.resolve.outputs.must_build }}
      cache_hit: ${{ steps.resolve.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Explicit version: FR-016 — a version with no matching tag
            # anywhere in history fails clearly, with no fallback
            # substitution and no unrequested build.
            if ! git tag --list "backend-v${INPUT_VERSION}" | grep -q .; then
              echo "::error::No such version: backend-v${INPUT_VERSION} does not exist and cannot be built — it does not correspond to any tested state that ever merged to main. Deploy refused rather than substituting a different version." >&2
              exit 1
            fi
            if ! gh release view "backend-v${INPUT_VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'backend-src.zip'; then
              # build-on-demand only knows how to build "latest" (it runs
              # semantic-release against current HEAD) — it cannot rebuild an
              # arbitrary older tagged version. Routing an explicit version's
              # cache miss there would silently swap in whatever "latest"
              # happens to be instead of the version actually requested, so
              # this fails clearly instead (FR-016), same as a nonexistent tag.
              echo "::error::backend-v${INPUT_VERSION} exists but has no cached backend-src.zip asset, and this pipeline cannot rebuild an arbitrary historical version. Deploy refused rather than substituting a different (e.g. latest) version." >&2
              exit 1
            fi
            {
              echo "version=$INPUT_VERSION"
              echo "must_build=false"
              echo "cache_hit=true"
            } >> "$GITHUB_OUTPUT"
          else
            # Unspecified: resolve to latest-at-execution-time (FR-013), not
            # whatever was latest when this run was triggered. "latest" may
            # not have been built yet at all (Edge Cases: a component never
            # built before) — always route through build-on-demand, whose
            # own internal idempotency check (research.md Decision 4/5)
            # makes this cheap when nothing has actually changed.
            {
              echo "version="
              echo "must_build=true"
              echo "cache_hit=false"
            } >> "$GITHUB_OUTPUT"
          fi

  build-on-demand:
    needs: resolve-version
    if: needs.resolve-version.outputs.must_build == 'true'
    # Cache-miss-on-latest build fallback (FR-015/User Story 5) only. An
    # explicit version's cache miss fails clearly above instead of landing
    # here — this job only knows how to build "latest", not an arbitrary
    # historical version.
    uses: ./.github/workflows/_build-backend.yml
    secrets: inherit

  ensure-artifact:
    needs: [resolve-version, build-on-demand]
    if: always() && needs.resolve-version.result == 'success' && (needs.build-on-demand.result == 'success' || needs.build-on-demand.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick-version.outputs.version }}
    steps:
      - name: Determine final version
        id: pick-version
        run: |
          # An explicitly requested version always wins, even if
          # build-on-demand happened to run and report a different
          # ("latest") version — never let it override what was asked for.
          RESOLVED_VERSION="${{ needs.resolve-version.outputs.version }}"
          if [ -n "$RESOLVED_VERSION" ]; then
            echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.build-on-demand.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the cached artifact
        # The exact artifact build-on-demand just produced (or that already
        # existed) — deployed as-is, no install/build/re-plan step here or
        # in the deploy job below (FR-009/SC-002).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "backend-v${{ steps.pick-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern backend-src.zip \
            --output backend-src.zip

      - name: Upload artifact for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: backend-src-${{ github.run_id }}
          path: backend-src.zip
          retention-days: 1

  deploy:
    needs: ensure-artifact
    # Explicit override, not the implicit default: GitHub Actions' default
    # job condition (success()) is evaluated against the *entire* upstream
    # dependency graph, not just this job's own `needs` list — so whenever
    # build-on-demand is skipped (the normal, expected outcome for an
    # explicit already-cached version), the implicit default would skip
    # this job too even though ensure-artifact succeeded, silently
    # deploying nothing while the run still reports overall success. The
    # always() is required too, not just the explicit result check: GitHub
    # Actions still implicitly ANDs any custom `if:` with success() (which
    # is exactly this same transitive check) unless the expression itself
    # calls a status-check function — confirmed live: this job stayed
    # skipped even after adding the bare needs.ensure-artifact.result
    # check with no always(). Discovered during quickstart.md Scenario 4
    # re-validation (#165).
    if: always() && needs.ensure-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download the resolved artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-src-${{ github.run_id }}

      - name: Unpack the artifact
        run: unzip -q backend-src.zip -d src

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync AzureWebJobsStorage key
        # Flex Consumption's internal storage settings require a real
        # account key even though storage_authentication_type =
        # "SystemAssignedIdentity" covers the deployment container path.
        # Terraform doesn't manage these two settings, so if the key drifts
        # the Function App silently fails to load any functions until
        # re-synced — doing it on every deploy makes that self-healing.
        run: |
          KEY=$(az storage account keys list \
            --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          CONN="DefaultEndpointsProtocol=https;AccountName=${{ vars.STORAGE_ACCOUNT_NAME }};AccountKey=${KEY};EndpointSuffix=core.windows.net"
          echo "::add-mask::$CONN"
          az functionapp config appsettings set \
            --name ${{ vars.FUNCTIONS_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --settings "AzureWebJobsStorage=${CONN}" "DEPLOYMENT_STORAGE_CONNECTION_STRING=${CONN}" \
            --output none

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          # "src" (not "src/backend"): the deploy root must contain the
          # `backend` package as a real subdirectory so `from backend.x
          # import y` resolves the same way it does under pytest.ini's
          # `pythonpath = src`.
          #
          # remote-build: true — NOT false. This Function App runs on Azure
          # Flex Consumption, which does not support a pre-built/vendored
          # Python package the way classic Consumption/Premium plans do —
          # confirmed empirically in production (remote-build: false
          # reported "successfully deployed" but the app then loaded zero
          # functions, 404 on every route). This means backend deploys still
          # pay a real build cost inside this step — the one piece of
          # FR-009's "no build step at deploy time" a genuine platform
          # constraint prevents for backend specifically. The build workflow
          # still produces, and this step still deploys, the exact
          # tested-and-versioned source tree — no separate checkout/rebuild
          # happens anywhere else in this job — so FR-009/SC-002's actual
          # guarantee (deploy ships what was tested, not a divergent copy)
          # still holds; only "no remote build at all" does not, for
          # backend. See research.md's amendment to Decision 3.
          app-name: ${{ vars.FUNCTIONS_APP_NAME }}
          package: "src"
          remote-build: true

      - name: Smoke test
        run: |
          # Entra ID auth is configured outside this Terraform, so a bare
          # curl won't get a 200. A 401 means the host loaded its functions
          # and routed the request correctly. A 404 means the host loaded
          # zero functions — treat that as a deploy failure.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://${{ vars.FUNCTIONS_APP_NAME }}.azurewebsites.net/api/auth/me")
          echo "Response status: $status"
          if [ "$status" = "000" ]; then
            echo "✗ No response from Functions app" >&2
            exit 1
          fi
          if [ "$status" = "404" ]; then
            echo "✗ 404 from a known route usually means the host loaded zero functions (storage auth or module-loading failure) — check Application Insights traces" >&2
            exit 1
          fi
          echo "✓ Functions app responded (status $status)"

      - name: Record deployed version
        run: echo "Deployed backend version ${{ needs.ensure-artifact.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
