name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/function_app.py"
      - "src/requirements.txt"
  workflow_dispatch: {}

# Targets `production` (no approval gate) — application deploys stay fully
# automatic per FR-010/SC-006. Only terraform-apply.yml targets the
# `production-infra` environment, which does require approval.
#
# Job graph (specs/023-cicd-pipeline-optimization): test -> release -> build -> deploy.
# `deploy` always consumes the exact artifact `build` produced in this same
# run via actions/upload-artifact/download-artifact, and never reinstalls
# dependencies or re-runs tests itself. It DOES still trigger Azure's Oryx
# remote build (remote-build: true, below) — this Function App's Flex
# Consumption plan doesn't support a pre-built Python package the way
# classic Consumption/Premium plans do (confirmed empirically 2026-09-01
# after `remote-build: false` deployed "successfully" but loaded zero
# functions). See contracts/workflow-interfaces.md for the job-graph and
# artifact-naming contract this file otherwise implements.
#
# concurrency: a newer push to main cancels an in-flight older run for this
# component before it deploys (FR-005/FR-006) — the "abort on conflict/
# newer version" guarantee, achieved via GitHub's native concurrency-group
# cancellation rather than a custom SHA-comparison step. Literal group name,
# not templated on github.ref (research.md decision #2).
concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install -r src/backend/requirements-dev.txt

      - name: Run tests
        run: pytest src/backend/tests/ -v

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is required for @semantic-release/github to create a
    # git tag + GitHub Release. semantic-release is deliberately configured
    # WITHOUT @semantic-release/git (research.md decision #3) so this
    # permission is never used to push a commit back to main — only to
    # create tags/releases, which are non-branch-history writes.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.compute-version.outputs.version }}
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full tag history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Require a seed version tag
        # semantic-release computes 1.0.0 for a component's first-ever
        # release when no prior tag exists. spec.md's Clarifications commit
        # to a 0.1.0 baseline instead, so a maintainer must seed
        # backend-v0.1.0 once (at rollout) pointing at a real commit
        # reachable from main — see .github/workflows/README.md.
        run: |
          if ! git tag --list 'backend-v*' | grep -q .; then
            echo "::error::No backend-v* tag found. Seed the 0.1.0 baseline once with: git tag backend-v0.1.0 <commit-on-main> && git push origin backend-v0.1.0 — see .github/workflows/README.md." >&2
            exit 1
          fi

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Compute this run's version output
        id: compute-version
        # The version to stamp into this run's artifact: whatever
        # semantic-release just released, or — if this run's commits
        # weren't releasable for backend (FR-013) — the existing latest
        # backend-v* tag, unchanged.
        run: |
          LATEST_TAG=$(git tag --list 'backend-v*' --sort=-v:refname | head -n1)
          echo "version=${LATEST_TAG#backend-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Stamp version into the artifact
        run: echo "${{ needs.release.outputs.version }}" > src/VERSION

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.run_id }}
          path: src
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build-${{ github.run_id }}
          path: src

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync AzureWebJobsStorage key
        # Flex Consumption's internal storage settings (AzureWebJobsStorage,
        # DEPLOYMENT_STORAGE_CONNECTION_STRING) require a real account key
        # even though storage_authentication_type = "SystemAssignedIdentity"
        # covers the deployment container path — see main.tf's comment on
        # shared_access_key_enabled. Terraform doesn't manage these two
        # settings, so if the key drifts (rotation, a stale/blank value from
        # first provisioning) the Function App silently fails to load any
        # functions at all until this is re-synced. Doing it on every deploy
        # makes that self-healing instead of a manual incident response.
        run: |
          KEY=$(az storage account keys list \
            --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          CONN="DefaultEndpointsProtocol=https;AccountName=${{ vars.STORAGE_ACCOUNT_NAME }};AccountKey=${KEY};EndpointSuffix=core.windows.net"
          echo "::add-mask::$CONN"
          az functionapp config appsettings set \
            --name ${{ vars.FUNCTIONS_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP_NAME }} \
            --settings "AzureWebJobsStorage=${CONN}" "DEPLOYMENT_STORAGE_CONNECTION_STRING=${CONN}" \
            --output none

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTIONS_APP_NAME }}
          # "src" (not "src/backend"): the deploy root must contain the
          # `backend` package as a real subdirectory so `from backend.x
          # import y` (used throughout src/backend/**) resolves the same way
          # it does under pytest.ini's `pythonpath = src`. src/function_app.py
          # is a thin shim satisfying Python v2's requirement that
          # function_app.py sit at the deploy root.
          #
          # remote-build: true — NOT false. This Function App runs on Flex
          # Consumption, which (confirmed empirically 2026-09-01, PR #149:
          # `remote-build: false` deployed "successfully" per the Azure/
          # functions-action step but the app then loaded zero functions,
          # 404 on every route) does not support a pre-built/vendored-
          # dependency Python package the way classic Consumption/Premium
          # plans do — it requires Azure's own Oryx remote build. This means
          # backend deploys still pay a real build cost inside this step
          # (the one piece of FR-001's "no rebuild at deploy time" that a
          # genuine platform constraint prevents), even though `build` above
          # still produces and this step still deploys the exact
          # tested-and-versioned source tree, not a separately checked-out
          # copy — see specs/023-cicd-pipeline-optimization/README notes.
          package: "src"
          remote-build: true

      - name: Smoke test
        run: |
          # Entra ID auth is configured outside this Terraform (see
          # 002-login-and-access-control), so a bare curl won't get a 200.
          # A 401 (no token provided) means the host loaded its functions
          # and routed the request correctly. A 404 means the host loaded
          # zero functions (e.g. the AzureWebJobsStorage/module-loading
          # failures this step and the one above guard against) — treat
          # that as a deploy failure, not a benign "some response" pass.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://${{ vars.FUNCTIONS_APP_NAME }}.azurewebsites.net/api/auth/me")
          echo "Response status: $status"
          if [ "$status" = "000" ]; then
            echo "✗ No response from Functions app" >&2
            exit 1
          fi
          if [ "$status" = "404" ]; then
            echo "✗ 404 from a known route usually means the host loaded zero functions (storage auth or module-loading failure) — check Application Insights traces" >&2
            exit 1
          fi
          echo "✓ Functions app responded (status $status)"
