name: Infrastructure Deploy

# CD: workflow_dispatch only, no version input, required-reviewer
# environment (specs/023-cicd-pipeline-optimization, FR-010/FR-011/FR-011a).
# Deploy is always a distinct, explicitly-triggered action — never a side
# effect of a push or merge to `main`.
#
# Unlike frontend/backend, infrastructure does NOT participate in the
# versioned build/cache/latest-resolution pattern — there is no persistent,
# versioned plan artifact and no `version` input. Each run always operates
# against the current state of `main` at execution time. Job graph:
# validate-and-test -> plan -> apply. `apply` targets the `production-infra`
# GitHub Environment, which MUST be configured (by the requesting human, not
# in this YAML) with a required-reviewer protection rule that has "Prevent
# self-review" enabled, with that human as the sole required reviewer. An AI
# agent can dispatch this workflow and complete validation/planning, but
# only that human can supply the approval — never the agent, and never the
# identity that dispatched the run.
#
# `apply` applies the exact plan `plan` produced earlier in this same run
# (passed via actions/upload-artifact, not regenerated) — if state has
# drifted since that plan was generated, `terraform apply <saved-plan>`
# fails outright with a native stale-plan error instead of silently
# re-planning.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: terraform fmt / validate
        run: ./infrastructure/tests/test_terraform_validate.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r infrastructure/tests/requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Run infrastructure tests
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_APP_ID: ${{ vars.AZURE_APP_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: pytest infrastructure/tests/ -v

  plan:
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
        run: terraform plan -input=false -out=tfplan -var-file=terraform.tfvars

      - name: Upload plan for the apply job
        # Same-run artifact only (actions/upload-artifact) — never a
        # persistent, versioned release. This is what makes `apply` below
        # apply the exact plan generated here rather than re-planning.
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-plan-${{ github.run_id }}
          path: infrastructure/terraform/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required-reviewer protection rule with "Prevent self-review" enabled
    # MUST be configured on this environment by the requesting human — this
    # YAML alone cannot enforce that; GitHub only pauses here for approval
    # if the environment is actually so configured.
    environment: production-infra
    steps:
      - uses: actions/checkout@v7
        with:
          # Only for the Terraform module source (`main.tf` etc.) that the
          # saved plan references — the plan file itself is downloaded and
          # unpacked below, never regenerated. Checkout MUST run before that
          # download step: actions/checkout cleans untracked files in the
          # workspace by default, which would otherwise delete the
          # just-downloaded tfplan.
          sparse-checkout: |
            infrastructure/terraform
          sparse-checkout-cone-mode: false

      - name: Download the plan artifact
        uses: actions/download-artifact@v8
        with:
          name: infrastructure-plan-${{ github.run_id }}
          path: infrastructure/terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Terraform Apply
        # Applies the exact plan `plan` produced above — no `-var-file` or
        # `-auto-approve` (both only apply when generating a new plan; a
        # saved plan file needs neither, and Terraform refuses to apply a
        # stale one on its own).
        working-directory: infrastructure/terraform
        run: terraform apply -input=false tfplan

      - name: Capture Terraform Outputs
        working-directory: infrastructure/terraform
        run: terraform output -json > outputs.json

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-outputs
          path: infrastructure/terraform/outputs.json
          retention-days: 5
