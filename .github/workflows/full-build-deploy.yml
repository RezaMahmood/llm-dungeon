name: Full Build & Deploy

# Manually-triggered orchestrator: deploys infrastructure, then backend,
# then frontend, in that order, by calling the three existing per-component
# deploy workflows (infrastructure-deploy.yml, backend-deploy.yml,
# frontend-deploy.yml) as reusable workflows via workflow_call — it does not
# reimplement any of their build/resolve/deploy logic.
#
# Each called workflow keeps its own guarantees unchanged: infra's `apply`
# job still pauses on the production-infra environment's required-reviewer
# approval gate, and backend/frontend still build-on-demand only on a cache
# miss for "latest" (see .github/workflows/README.md).
#
# `mode` chooses between:
#   - "refresh everything": deploy latest-at-execution-time for both
#     backend and frontend (blank version — same as leaving the version
#     input blank on their individual deploy workflows).
#   - "specific versions": deploy the exact backend_version/frontend_version
#     given (blank still falls back to latest for that component only).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy latest of everything, or pin specific component versions?"
        type: choice
        required: true
        default: "refresh everything"
        options:
          - "refresh everything"
          - "specific versions"
      backend_version:
        description: "Exact backend-v<version> to deploy. Only used when mode = specific versions; blank = latest."
        type: string
        required: false
        default: ""
      frontend_version:
        description: "Exact frontend-v<version> to deploy. Only used when mode = specific versions; blank = latest."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend_version: ${{ steps.resolve.outputs.backend_version }}
      frontend_version: ${{ steps.resolve.outputs.frontend_version }}
    steps:
      - name: Resolve requested versions
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          BACKEND_VERSION: ${{ inputs.backend_version }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          if [ "$MODE" = "refresh everything" ]; then
            # Force blank regardless of what the form fields held — "refresh
            # everything" always means latest-at-execution-time for both.
            echo "backend_version=" >> "$GITHUB_OUTPUT"
            echo "frontend_version=" >> "$GITHUB_OUTPUT"
          else
            echo "backend_version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"
            echo "frontend_version=$FRONTEND_VERSION" >> "$GITHUB_OUTPUT"
          fi

  deploy-infrastructure:
    needs: resolve-inputs
    uses: ./.github/workflows/infrastructure-deploy.yml
    secrets: inherit

  deploy-backend:
    needs: [resolve-inputs, deploy-infrastructure]
    uses: ./.github/workflows/backend-deploy.yml
    with:
      version: ${{ needs.resolve-inputs.outputs.backend_version }}
    secrets: inherit

  deploy-frontend:
    needs: [resolve-inputs, deploy-backend]
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      version: ${{ needs.resolve-inputs.outputs.frontend_version }}
    secrets: inherit
