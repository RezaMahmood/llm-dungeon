name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
  workflow_dispatch: {}

# Targets `production` (no approval gate) — application deploys stay fully
# automatic per FR-010/SC-006.
permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        # npm ci requires a committed package-lock.json — .gitignore
        # deliberately excludes it (matches test.yml's frontend-test job).
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build static site
        env:
          # msalConfig.js reads these via import.meta.env at build time
          # (Vite bakes them into the bundle) — see plan.md's 2026-08-29
          # Amendment and research.md Decision 9 for why this step exists.
          # VITE_AZURE_REDIRECT_URI is deliberately left unset: Azure Static
          # Web Apps get a randomly generated hostname (e.g.
          # calm-bay-063862603.7.azurestaticapps.net), not one derived from
          # STATIC_WEB_APP_NAME, so hardcoding it here would be wrong.
          # msalConfig.js falls back to `window.location.origin + "/"` at
          # runtime, which is always correct regardless of hostname.
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_AZURE_APP_ID: ${{ vars.AZURE_APP_ID }}
        run: |
          if [ -z "$VITE_AZURE_TENANT_ID" ] || [ -z "$VITE_AZURE_APP_ID" ]; then
            echo "::error::VITE_AZURE_TENANT_ID / VITE_AZURE_APP_ID are not set — MSAL sign-in would silently break in production (FR-014). Set the AZURE_TENANT_ID and AZURE_APP_ID GitHub repository variables." >&2
            exit 1
          fi
          npm run build

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
