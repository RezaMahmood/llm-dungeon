name: Frontend Deploy

# CD: workflow_dispatch only, version input, no approval gate
# (specs/023-cicd-pipeline-optimization, FR-010/FR-011/FR-011b). Deploy is
# always a distinct, explicitly-triggered action — never a side effect of
# a push or merge to `main`. Frontend deploys execute directly once
# triggered, unlike infrastructure-deploy.yml's approval-gated apply.
#
# Job graph: resolve-version -> build-on-demand (conditional) ->
# ensure-artifact -> deploy. build-on-demand is its own job (not a step of
# ensure-artifact) because GitHub Actions requires a reusable-workflow
# call (`uses: ./.github/workflows/_build-frontend.yml`) to be the entire
# content of its job — see contracts/workflow-interfaces.md for the
# conceptual 3-stage contract this graph implements.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact frontend-v<version> to deploy. Leave blank to deploy the latest available version at execution time."
        required: false
        type: string
        default: ""

permissions:
  # contents: write (not read) — the build-on-demand job below calls
  # _build-frontend.yml, which needs contents: write to create a git
  # tag/GitHub Release via semantic-release. A called reusable workflow
  # cannot request more than its caller grants (GitHub Actions fails
  # the whole run at startup, zero jobs created, if it does) — this
  # bit only surfaces the first time an actual cache-miss deploy runs,
  # so it went undetected until then.
  contents: write
  id-token: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      must_build: ${{ steps.resolve.outputs.must_build }}
      cache_hit: ${{ steps.resolve.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Explicit version: FR-016 — a version with no matching tag
            # anywhere in history fails clearly, with no fallback
            # substitution and no unrequested build.
            if ! git tag --list "frontend-v${INPUT_VERSION}" | grep -q .; then
              echo "::error::No such version: frontend-v${INPUT_VERSION} does not exist and cannot be built — it does not correspond to any tested state that ever merged to main. Deploy refused rather than substituting a different version." >&2
              exit 1
            fi
            if gh release view "frontend-v${INPUT_VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'frontend-dist.zip'; then
              CACHE_HIT=true
            else
              CACHE_HIT=false
            fi
            {
              echo "version=$INPUT_VERSION"
              echo "must_build=false"
              echo "cache_hit=$CACHE_HIT"
            } >> "$GITHUB_OUTPUT"
          else
            # Unspecified: resolve to latest-at-execution-time (FR-013), not
            # whatever was latest when this run was triggered. "latest" may
            # not have been built yet at all (Edge Cases: a component never
            # built before) — always route through build-on-demand, whose
            # own internal idempotency check (research.md Decision 4/5)
            # makes this cheap when nothing has actually changed.
            {
              echo "version="
              echo "must_build=true"
              echo "cache_hit=false"
            } >> "$GITHUB_OUTPUT"
          fi

  build-on-demand:
    needs: resolve-version
    if: needs.resolve-version.outputs.must_build == 'true' || needs.resolve-version.outputs.cache_hit != 'true'
    # Cache-miss-on-latest build fallback (FR-015/User Story 5). Also
    # covers the abnormal case of an explicit version whose tag exists but
    # whose release asset is missing — rebuilding that exact tested state
    # is safe and distinct from FR-016's true not-found failure above.
    uses: ./.github/workflows/_build-frontend.yml
    secrets: inherit

  ensure-artifact:
    needs: [resolve-version, build-on-demand]
    if: always() && needs.resolve-version.result == 'success' && (needs.build-on-demand.result == 'success' || needs.build-on-demand.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick-version.outputs.version }}
    steps:
      - name: Determine final version
        id: pick-version
        run: |
          BUILD_VERSION="${{ needs.build-on-demand.outputs.version }}"
          if [ -n "$BUILD_VERSION" ]; then
            echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the cached artifact
        # The exact artifact build-on-demand just produced (or that already
        # existed) — deployed as-is, no install/build/re-plan step here or
        # in the deploy job below (FR-009/SC-002).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "frontend-v${{ steps.pick-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern frontend-dist.zip \
            --output frontend-dist.zip

      - name: Upload artifact for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend-dist.zip
          retention-days: 1

  deploy:
    needs: ensure-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download the resolved artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.run_id }}

      - name: Unpack the artifact
        run: unzip -q frontend-dist.zip -d dist

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Record deployed version
        run: echo "Deployed frontend version ${{ needs.ensure-artifact.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
