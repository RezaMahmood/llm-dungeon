name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

# Targets `production` (no approval gate) — application deploys stay fully
# automatic per FR-010/SC-006.
permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        # npm ci requires a committed package-lock.json — .gitignore
        # deliberately excludes it (matches test.yml's frontend-test job).
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
