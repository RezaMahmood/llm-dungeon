name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
  workflow_dispatch: {}

# Targets `production` (no approval gate) — application deploys stay fully
# automatic per FR-010/SC-006.
#
# Job graph (specs/023-cicd-pipeline-optimization): test -> build -> deploy.
# `deploy` always consumes the exact `dist/` artifact `build` produced in
# this same run — it never re-runs `npm install`/`npm run build`. See
# contracts/workflow-interfaces.md for the job-graph and artifact-naming
# contract this file implements.
permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # msalConfig.js reads these via import.meta.env at build time
          # (Vite bakes them into the bundle) — see plan.md's 2026-08-29
          # Amendment and research.md Decision 9 for why this step exists.
          # VITE_AZURE_REDIRECT_URI is deliberately left unset: Azure Static
          # Web Apps get a randomly generated hostname (e.g.
          # calm-bay-063862603.7.azurestaticapps.net), not one derived from
          # STATIC_WEB_APP_NAME, so hardcoding it here would be wrong.
          # msalConfig.js falls back to `window.location.origin + "/"` at
          # runtime, which is always correct regardless of hostname.
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_AZURE_APP_ID: ${{ vars.AZURE_APP_ID }}
        run: |
          if [ -z "$VITE_AZURE_TENANT_ID" ] || [ -z "$VITE_AZURE_APP_ID" ]; then
            echo "::error::VITE_AZURE_TENANT_ID / VITE_AZURE_APP_ID are not set — MSAL sign-in would silently break in production (FR-014). Set the AZURE_TENANT_ID and AZURE_APP_ID GitHub repository variables." >&2
            exit 1
          fi
          npm run build

      - name: Stamp version into the artifact
        # Placeholder until 023-cicd-pipeline-optimization's User Story 3
        # (semantic-release) replaces this with the real computed version.
        run: |
          printf '{"version": "%s"}' "${GITHUB_SHA:0:7}" > dist/version.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: src/frontend/dist
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: dist

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
