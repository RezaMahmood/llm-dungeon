name: Frontend Deploy

# CD: workflow_dispatch only, version input, no approval gate
# (specs/023-cicd-pipeline-optimization, FR-010/FR-011/FR-011b). Deploy is
# always a distinct, explicitly-triggered action — never a side effect of
# a push or merge to `main`. Frontend deploys execute directly once
# triggered, unlike infrastructure-deploy.yml's approval-gated apply.
#
# Job graph: resolve-version -> build-on-demand (conditional) ->
# ensure-artifact -> deploy. build-on-demand is its own job (not a step of
# ensure-artifact) because GitHub Actions requires a reusable-workflow
# call (`uses: ./.github/workflows/_build-frontend.yml`) to be the entire
# content of its job — see contracts/workflow-interfaces.md for the
# conceptual 3-stage contract this graph implements.
#
# Also callable via workflow_call (full-build-deploy.yml), with the same
# `version` semantics, so the combined workflow reuses this exact job graph
# instead of duplicating it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact frontend-v<version> to deploy. Leave blank to deploy the latest available version at execution time."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Exact frontend-v<version> to deploy. Leave blank to deploy the latest available version at execution time."
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "The frontend version that was deployed."
        value: ${{ jobs.ensure-artifact.outputs.version }}

permissions:
  # contents: write (not read) — the build-on-demand job below calls
  # _build-frontend.yml, which needs contents: write to create a git
  # tag/GitHub Release via semantic-release. A called reusable workflow
  # cannot request more than its caller grants (GitHub Actions fails
  # the whole run at startup, zero jobs created, if it does) — this
  # bit only surfaces the first time an actual cache-miss deploy runs,
  # so it went undetected until then.
  contents: write
  id-token: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      must_build: ${{ steps.resolve.outputs.must_build }}
      cache_hit: ${{ steps.resolve.outputs.cache_hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Explicit version: FR-016 — a version with no matching tag
            # anywhere in history fails clearly, with no fallback
            # substitution and no unrequested build.
            if ! git tag --list "frontend-v${INPUT_VERSION}" | grep -q .; then
              echo "::error::No such version: frontend-v${INPUT_VERSION} does not exist and cannot be built — it does not correspond to any tested state that ever merged to main. Deploy refused rather than substituting a different version." >&2
              exit 1
            fi
            if ! gh release view "frontend-v${INPUT_VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'frontend-dist.zip'; then
              # build-on-demand only knows how to build "latest" (it runs
              # semantic-release against current HEAD) — it cannot rebuild an
              # arbitrary older tagged version. Routing an explicit version's
              # cache miss there would silently swap in whatever "latest"
              # happens to be instead of the version actually requested, so
              # this fails clearly instead (FR-016), same as a nonexistent tag.
              echo "::error::frontend-v${INPUT_VERSION} exists but has no cached frontend-dist.zip asset, and this pipeline cannot rebuild an arbitrary historical version. Deploy refused rather than substituting a different (e.g. latest) version." >&2
              exit 1
            fi
            {
              echo "version=$INPUT_VERSION"
              echo "must_build=false"
              echo "cache_hit=true"
            } >> "$GITHUB_OUTPUT"
          else
            # Unspecified: resolve to latest-at-execution-time (FR-013), not
            # whatever was latest when this run was triggered. "latest" may
            # not have been built yet at all (Edge Cases: a component never
            # built before) — always route through build-on-demand, whose
            # own internal idempotency check (research.md Decision 4/5)
            # makes this cheap when nothing has actually changed.
            {
              echo "version="
              echo "must_build=true"
              echo "cache_hit=false"
            } >> "$GITHUB_OUTPUT"
          fi

  build-on-demand:
    needs: resolve-version
    if: needs.resolve-version.outputs.must_build == 'true'
    # Cache-miss-on-latest build fallback (FR-015/User Story 5) only. An
    # explicit version's cache miss fails clearly above instead of landing
    # here — this job only knows how to build "latest", not an arbitrary
    # historical version.
    uses: ./.github/workflows/_build-frontend.yml
    secrets: inherit

  ensure-artifact:
    needs: [resolve-version, build-on-demand]
    if: always() && needs.resolve-version.result == 'success' && (needs.build-on-demand.result == 'success' || needs.build-on-demand.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pick-version.outputs.version }}
    steps:
      - name: Determine final version
        id: pick-version
        run: |
          # An explicitly requested version always wins, even if
          # build-on-demand happened to run and report a different
          # ("latest") version — never let it override what was asked for.
          RESOLVED_VERSION="${{ needs.resolve-version.outputs.version }}"
          if [ -n "$RESOLVED_VERSION" ]; then
            echo "version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.build-on-demand.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the cached artifact
        # The exact artifact build-on-demand just produced (or that already
        # existed) — deployed as-is, no install/build/re-plan step here or
        # in the deploy job below (FR-009/SC-002).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "frontend-v${{ steps.pick-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern frontend-dist.zip \
            --output frontend-dist.zip

      - name: Upload artifact for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend-dist.zip
          retention-days: 1

  deploy:
    needs: ensure-artifact
    # Explicit override, not the implicit default: GitHub Actions' default
    # job condition (success()) is evaluated against the *entire* upstream
    # dependency graph, not just this job's own `needs` list — so whenever
    # build-on-demand is skipped (the normal, expected outcome for an
    # explicit already-cached version), the implicit default would skip
    # this job too even though ensure-artifact succeeded, silently
    # deploying nothing while the run still reports overall success. The
    # always() is required too, not just the explicit result check: GitHub
    # Actions still implicitly ANDs any custom `if:` with success() (which
    # is exactly this same transitive check) unless the expression itself
    # calls a status-check function — confirmed live: this job stayed
    # skipped even after adding the bare needs.ensure-artifact.result
    # check with no always(). Discovered during quickstart.md Scenario 4
    # re-validation (#165).
    if: always() && needs.ensure-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download the resolved artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.run_id }}

      - name: Unpack the artifact
        run: unzip -q frontend-dist.zip -d dist

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Record deployed version
        run: echo "Deployed frontend version ${{ needs.ensure-artifact.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
