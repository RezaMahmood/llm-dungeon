name: Backend Build

# CI: build+version+cache on merge to main (specs/023-cicd-pipeline-
# optimization, FR-004/FR-005/FR-006). Automatic — push to `main` only,
# path-scoped to backend. No `deploy` job here: deploy is always a
# separate, explicitly-triggered action (backend-deploy.yml, FR-010).
# Skips entirely when every changed file is non-testable content
# (FR-019/FR-020) via .github/actions/detect-non-testable-changes.

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/function_app.py"
      - "src/requirements.txt"

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      all-non-testable: ${{ steps.detect.outputs.all-non-testable }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/detect-non-testable-changes
        id: detect

  build:
    needs: changes
    if: needs.changes.outputs.all-non-testable != 'true'
    uses: ./.github/workflows/_build-backend.yml
    secrets: inherit
