name: Terraform Validate

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - "infrastructure/tests/test_terraform_validate.sh"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: terraform fmt / validate
        run: ./infrastructure/tests/test_terraform_validate.sh

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (with backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
        run: terraform plan -input=false -out=tfplan -var-file=terraform.tfvars

      - name: Upload plan artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infrastructure/terraform/tfplan
          retention-days: 5

      # This plan step is FR-016's automated drift check: a manually-changed
      # resource surfaces here as a non-empty plan on the very next PR/push,
      # rather than being silently reverted or accepted (spec.md Edge Cases).
