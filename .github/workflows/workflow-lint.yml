name: Workflow Lint

# Required check per specs/023-cicd-pipeline-optimization/research.md decision #8
# (constitution Principle I — every PR that touches workflow YAML gets an
# automated, non-manual check, not just human review). This only catches
# syntax/schema/expression errors; behavioral/structural correctness per
# user story is covered by scripts/test-workflow-structure.sh and
# scripts/test-release-fixtures.sh (see /speckit-analyze finding G1).

on:
  pull_request: {}
  # No `paths:` filter: this check is required in main's ruleset
  # (repos/RezaMahmood/llm-dungeon/rulesets/21767050), and GitHub's required-
  # status-check enforcement blocks merge forever if a required check's
  # workflow never triggers at all for a given PR (a path filter on the
  # *workflow trigger* prevents the check run from being created, which is
  # different from — and NOT satisfied by — a job-level `if:` reporting
  # "skipped"). This lint is fast (a few seconds) and cheap enough to run
  # on every PR regardless of what it touches.

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
