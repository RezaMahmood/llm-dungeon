name: Test Suite
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "specs/**"
      - "docs/**"
      - "**/*.md"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!specs/**'
              - '!docs/**'
              - '!**/*.md'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f src/backend/requirements.txt ]; then pip install -r src/backend/requirements.txt; fi
          if [ -f src/backend/requirements-dev.txt ]; then pip install -r src/backend/requirements-dev.txt; fi
          if [ -f infrastructure/tests/requirements.txt ]; then pip install -r infrastructure/tests/requirements.txt; fi

      - name: Run test suite
        run: |
          set +e
          pytest -v
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then
            echo "No tests found"
            exit 0
          fi
          exit $exit_code

  frontend-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: check
        run: echo "exists=$( [ -f package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm install

      - name: Run test suite
        if: steps.check.outputs.exists == 'true'
        run: npm test
