name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch: {}

# Gates `terraform apply` behind two automated checks (`validate`, `test`) before the
# apply job's production-infra approval prompt is ever reachable — see
# specs/020-terraform-apply-gating-done/. `validate` and `test` mirror the steps that used to
# run as the independent terraform-validate.yml/infrastructure-tests.yml push-triggered
# workflows (those keep only their pull_request/schedule/workflow_dispatch triggers now).
# `apply` targets the production-infra GitHub environment (created, along with its
# required-reviewer protection rule, by T014 in Foundational — see
# specs/007-azure-infrastructure-provisioning/tasks.md) so this workflow pauses
# for manual approval before `terraform apply` touches Azure. backend-deploy.yml
# and frontend-deploy.yml target the separate `production` environment and stay
# unapproved/automatic (FR-010/SC-006).
permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: terraform fmt / validate
        run: ./infrastructure/tests/test_terraform_validate.sh

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (with backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
        run: terraform plan -input=false -out=tfplan -var-file=terraform.tfvars

      # This plan step is FR-016's automated drift check: a manually-changed
      # resource surfaces here as a non-empty plan on the very next push,
      # rather than being silently reverted or accepted (spec.md Edge Cases).

      - name: Upload plan artifact
        # `apply` (below) applies this exact file rather than generating a
        # new plan immediately before applying (specs/023-cicd-pipeline-
        # optimization FR-015) — if state has drifted since this plan was
        # generated, `terraform apply <saved-plan>` fails outright with a
        # native stale-plan error (FR-016) instead of silently re-planning.
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infrastructure/terraform/tfplan
          retention-days: 1

  test:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Install test dependencies
        run: pip install -r infrastructure/tests/requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (read-only, for `terraform output`)
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Run infrastructure tests
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_APP_ID: ${{ vars.AZURE_APP_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: pytest infrastructure/tests/ -v

  apply:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend-config=backend-prod.hcl -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infrastructure/terraform

      - name: Terraform Apply
        # Applies the exact plan `validate` generated and `test`/the
        # production-infra approval gate reviewed — no `-var-file` or
        # `-auto-approve` (both only apply when generating a new plan; a
        # saved plan file needs neither, and Terraform refuses to apply a
        # stale one on its own).
        working-directory: infrastructure/terraform
        run: terraform apply -input=false tfplan

      - name: Capture Terraform Outputs
        working-directory: infrastructure/terraform
        run: terraform output -json > outputs.json

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infrastructure/terraform/outputs.json
          retention-days: 5
