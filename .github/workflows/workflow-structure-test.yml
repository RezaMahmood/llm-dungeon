name: Workflow Structure Test

# Required checks per specs/023-cicd-pipeline-optimization/research.md
# decision #8 (constitution Principle I / /speckit-analyze finding G1).
# actionlint (workflow-lint.yml) only catches YAML syntax/schema errors —
# this asserts the actual job/step *shape* each user story depends on:
# US1 (no rebuild in `deploy`), US2 (concurrency block present), US5
# (terraform apply references the saved plan). See
# scripts/test-workflow-structure.js and contracts/workflow-interfaces.md.

on:
  pull_request: {}
  # No `paths:` filter: this check is required in main's ruleset
  # (repos/RezaMahmood/llm-dungeon/rulesets/21767050), and GitHub's required-
  # status-check enforcement blocks merge forever if a required check's
  # workflow never triggers at all for a given PR. This test validates the
  # *current* state of the deploy/terraform-apply workflows (not the PR's
  # diff), so it's meaningful and fast (~10s) to run unconditionally.

permissions:
  contents: read

jobs:
  structure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run workflow-structure assertion tests
        run: npm run test:workflow-structure
