name: Workflow Structure Test

# Required checks per specs/023-cicd-pipeline-optimization/research.md
# decision #8 (constitution Principle I / /speckit-analyze finding G1).
# actionlint (workflow-lint.yml) only catches YAML syntax/schema errors —
# this asserts the actual job/step *shape* each user story depends on: US1
# (test-on-push, non-testable-change skip), US2 (build/version/cache, no
# deploy/apply job in CI), US3 (deploy is workflow_dispatch-only, no rebuild
# in deploy/apply, infra's approval-gate asymmetry), US4 (resolve-version
# before ensure-artifact), US5 (build-on-demand fallback). See
# scripts/workflow-checks/test-workflow-structure.js and
# contracts/workflow-interfaces.md.
#
# Dependencies live in scripts/workflow-checks/package.json, split out from
# scripts/release-fixtures/package.json (issue #192) so this lightweight,
# always-run check doesn't install semantic-release-monorepo's much heavier
# transitive tree, which only release-fixtures-test.yml needs.

on:
  pull_request: {}
  # No `paths:` filter: this check is required in main's ruleset
  # (repos/RezaMahmood/llm-dungeon/rulesets/21767050), and GitHub's required-
  # status-check enforcement blocks merge forever if a required check's
  # workflow never triggers at all for a given PR. This test validates the
  # *current* state of the deploy/build workflows (not the PR's diff), so
  # it's meaningful and fast (~10s) to run unconditionally.

permissions:
  contents: read

jobs:
  structure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/workflow-checks
    steps:
      - uses: actions/checkout@v7

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-workflow-checks-${{ hashFiles('scripts/workflow-checks/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-workflow-checks-
            npm-cache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/workflow-checks/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run workflow-structure assertion tests
        run: npm run test:workflow-structure

      - name: Run non-testable-change detection fixture tests
        run: npm run test:non-testable-detection
