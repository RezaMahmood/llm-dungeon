name: App Deploy (Backend + Frontend)

# Manually-triggered orchestrator: deploys backend, then frontend, by
# calling the two existing per-component deploy workflows
# (backend-deploy.yml, frontend-deploy.yml) as reusable workflows via
# workflow_call — it does not reimplement any of their build/resolve/deploy
# logic, and it never touches infrastructure-deploy.yml.
#
# Each called workflow keeps its own guarantees unchanged: backend/frontend
# still build-on-demand only on a cache miss for "latest" (see
# .github/workflows/README.md).
#
# `mode` chooses between:
#   - "refresh both": deploy latest-at-execution-time for both backend and
#     frontend (blank version — same as leaving the version input blank on
#     their individual deploy workflows).
#   - "specific versions": deploy the exact backend_version/frontend_version
#     given (blank still falls back to latest for that component only).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy latest of both components, or pin specific component versions?"
        type: choice
        required: true
        default: "refresh both"
        options:
          - "refresh both"
          - "specific versions"
      backend_version:
        description: "Bare version number to deploy, e.g. 1.2.3 (not the backend-v<version> tag). Only used when mode = specific versions; blank = latest."
        type: string
        required: false
        default: ""
      frontend_version:
        description: "Bare version number to deploy, e.g. 1.2.3 (not the frontend-v<version> tag). Only used when mode = specific versions; blank = latest."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Least-privilege override: this job only manipulates its own inputs in
    # a shell step — it never calls the GitHub API — unlike the top-level
    # contents: write / id-token: write, which the downstream deploy-*
    # workflow_call jobs need.
    permissions: {}
    outputs:
      backend_version: ${{ steps.resolve.outputs.backend_version }}
      frontend_version: ${{ steps.resolve.outputs.frontend_version }}
    steps:
      - name: Resolve requested versions
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          BACKEND_VERSION: ${{ inputs.backend_version }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          # "refresh both" always forces blank (latest-at-execution-time for
          # both), regardless of what the form fields held. The multiline
          # $GITHUB_OUTPUT form with a random delimiter (rather than
          # "key=$VALUE") avoids output injection if a version input ever
          # contained a newline (or a line matching a fixed delimiter).
          if [ "$MODE" = "refresh both" ]; then
            BACKEND_VERSION=""
            FRONTEND_VERSION=""
          fi
          DELIM="GITHUB_OUTPUT_EOF_$(openssl rand -hex 16)"
          {
            echo "backend_version<<$DELIM"
            echo "$BACKEND_VERSION"
            echo "$DELIM"
            echo "frontend_version<<$DELIM"
            echo "$FRONTEND_VERSION"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: resolve-inputs
    uses: ./.github/workflows/backend-deploy.yml
    with:
      version: ${{ needs.resolve-inputs.outputs.backend_version }}
    secrets: inherit

  deploy-frontend:
    needs: [resolve-inputs, deploy-backend]
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      version: ${{ needs.resolve-inputs.outputs.frontend_version }}
    secrets: inherit
